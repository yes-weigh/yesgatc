name: Release Certificate Worker

on:
  push:
    tags:
      - certificate-worker-v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create (e.g. certificate-worker-v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: certificate-worker-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      ZIP_PATH: certificate-worker/publish/Yesgatc.CertificateWorker-win-x64.zip
      EMAAP_ENGINE_ZIP_PATH: certificate-worker/publish/EmaapEngine-win-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows zips
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File certificate-worker/scripts/publish-release.ps1
          if (-not (Test-Path $env:ZIP_PATH)) { throw "Missing $env:ZIP_PATH" }
          if (-not (Test-Path $env:EMAAP_ENGINE_ZIP_PATH)) { throw "Missing $env:EMAAP_ENGINE_ZIP_PATH" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zips
          path: |
            certificate-worker/publish/Yesgatc.CertificateWorker-win-x64.zip
            certificate-worker/publish/EmaapEngine-win-x64.zip

  release:
    needs: [windows]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Certificate Worker ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/windows-zips/Yesgatc.CertificateWorker-win-x64.zip
            artifacts/windows-zips/EmaapEngine-win-x64.zip
          body: |
            - **Yesgatc.CertificateWorker-win-x64.zip** — VPS Super Admin
            - **EmaapEngine-win-x64.zip** — RC Windows (`EmaapEngine.exe`)

            ### RC Windows
            Unzip, run **EmaapEngine.exe**. Sign in with RC Aadhar + portal password. Type eMAAP captcha/OTP in Chrome. eMAAP user/pass is built in.

            ### VPS
            ```powershell
            powershell -ExecutionPolicy Bypass -File C:\YesGATC\CertificateWorker\pull-update.ps1 -Start
            ```
