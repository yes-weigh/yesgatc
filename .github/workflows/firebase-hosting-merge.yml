name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'src/lib/appVersion.ts'
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  deployments: write
  pull-requests: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Bump app version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout --force -B main origin/main

          CHANGED="$(git diff --name-only HEAD~1 HEAD -- src/lib/appVersion.ts || true)"
          if [ -n "$CHANGED" ]; then
            echo "appVersion.ts already changed in latest main — skip bump"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            NEXT="$(node scripts/bump-app-version.mjs)"
            git add src/lib/appVersion.ts
            git commit -m "chore: bump app version to ${NEXT}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}), retry from origin/main"
            git fetch origin main
            git checkout --force -B main origin/main
            CHANGED="$(git diff --name-only HEAD~1 HEAD -- src/lib/appVersion.ts || true)"
            if [ -n "$CHANGED" ]; then
              echo "appVersion.ts already changed in latest main — skip bump"
              exit 0
            fi
          done
          echo "failed to push version bump"
          exit 1
      - run: npm install && npm run build
        env:
          VITE_WEATHERAPI_KEY: ${{ secrets.VITE_WEATHERAPI_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_PWA_ORIGIN: https://yesgatc.web.app
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YESGATC }}
          channelId: live
          projectId: yesgatc
